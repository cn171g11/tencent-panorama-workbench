<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地街景查看</title><link rel="stylesheet" href="vendor/pannellum.css"><style>html,body,#pano{height:100%;margin:0;background:#10141a;color:#dce3ea;font:14px system-ui,"Microsoft YaHei",sans-serif}#status{position:fixed;z-index:2;left:12px;top:12px;padding:8px 12px;border:1px solid #2c3540;border-radius:7px;background:#1d232bdd;color:#dce3ea}#back{position:fixed;z-index:3;right:12px;top:12px;color:#fff;background:#173455;border:1px solid #4da3ff;border-radius:6px;padding:7px 12px;text-decoration:none}</style></head><body><div id="status">准备加载六面街景…</div><a id="back" href="index.html">返回查看器</a><div id="pano"></div><script src="vendor/pannellum.js"></script><script>
(function(){'use strict';var q=new URLSearchParams(location.hash.slice(1)),sid=q.get('sid')||'',c=q.get('c')||'',d=q.get('d')||'',status=document.getElementById('status');if(!sid){status.textContent='缺少街景ID';return}var order=[2,3,4,1,5,6],urls=[];function face(n){var canvas=document.createElement('canvas');canvas.width=1024;canvas.height=1024;var ctx=canvas.getContext('2d'),loads=[];for(var row=0;row<2;row++)for(var col=0;col<2;col++){var img=new Image();img.crossOrigin='anonymous';loads.push(new Promise(function(resolve,reject){img.onload=function(){resolve({img:img,row:row,col:col})};img.onerror=function(){reject(Error('六面瓦片加载失败'))};img.src='https://streetapi.ishowchina.com/image/tile/'+encodeURIComponent(sid)+'?'+(c||d?'c='+encodeURIComponent(c)+'&d='+encodeURIComponent(d)+'&':'')+'zoom=3&face='+n+'&row='+row+'&col='+col}));}return Promise.all(loads).then(function(items){items.forEach(function(x){ctx.drawImage(x.img,x.col*512,x.row*512,512,512)});return new Promise(function(resolve,reject){canvas.toBlob(function(blob){if(blob)resolve(URL.createObjectURL(blob));else reject(Error('无法生成街景面'))},'image/jpeg',.92)})})}Promise.all(order.map(face)).then(function(images){status.remove();window.__PANORAMA__=pannellum.viewer('pano',{type:'cubemap',cubeMap:images,autoLoad:true,showZoomCtrl:true,showFullscreenCtrl:true});}).catch(function(error){status.textContent=error.message+'；如果服务端拒绝跨域，请使用“打开街景”外部查看。';});})();
</script></body></html>
